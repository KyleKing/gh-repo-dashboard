# Copier never updates this file (_skip_if_exists), so it holds only
# project-owned settings. Template-managed tool pins and tasks live in
# .config/mise/conf.d/template.toml; project-specific additions belong in
# other .config/mise/conf.d/*.toml files (always loaded)

[settings]
experimental = true

[env]
# Wide enough for the 140-column preview pane, which the template's 1180px default is not.
STILLS_BREAKPOINTS = "wide=1700x760 narrow=700x700"
